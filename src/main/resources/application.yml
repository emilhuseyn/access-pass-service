spring:
  application:
    name: access-pass-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/access_pass}
    username: ${DATABASE_USERNAME:access_pass}
    password: ${DATABASE_PASSWORD:access_pass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration/common
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

access-pass:
  jwt:
    issuer: access-pass-service
    ttl: 15m
